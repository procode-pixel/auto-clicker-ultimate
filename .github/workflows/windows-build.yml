name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

      - name: Package
        run: python -m PyInstaller --noconfirm AutoClickerUltimate.spec

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\AutoClickerUltimate\* -DestinationPath release\AutoClickerUltimate-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClickerUltimate-win64
          path: release/AutoClickerUltimate-win64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AutoClickerUltimate-win64.zip
          generate_release_notes: true
          body: |
            Windows build of Auto Clicker Ultimate. Unzip and run AutoClickerUltimate.exe.
            Python does not need to be installed. No administrator rights are required.
